kind = "web"
previewPath = "/"
title = "Procurement Optimizer"
description = "An interactive procurement decision-support app that lets procurement professionals model demand, supplier constraints, costs, and delivery requirements, then run the existing PuLP optimization model to see recommended allocations and business impact."
version = "1.0.0"
id = "artifacts/procurement-optimizer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21643

[services.development]
run = "pnpm --filter @workspace/procurement-optimizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/procurement-optimizer", "run", "build" ]
serve = "static"
publicDir = "artifacts/procurement-optimizer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21643"
BASE_PATH = "/"
